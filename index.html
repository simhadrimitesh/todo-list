<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="TDL.css">
</head>
<body >
    
    <h1 id="heading">|      My To-Do List      |</h1>
    <div class="top">
    
    <input class="searchbar" id="text" type="search"  placeholder="Enter Task......">
    <input class="searchbar" id="btn" type="button" value="Add">
    <div class="screen">
 <!-- <div class="main"></div> -->
  <div class="content">

    <div class="task-section">
        <span id="task">Tasks!</span>
        <div id="progbar">
        <span id="progress">Progress:</span>
        <span id="progval">0</span>
        <div id="load">
        <div class="progress">
        <div id="progressbar"></div>
    </div></div>
        </div>
        <div class="text"></div>
    </div>

    <div class="active">
        <div class="active1" id="a1">
            <p><i class="fa-solid fa-file"></i><p>Total</p></p>
            <p id="total">0</p>
        </div>

        <div class="active1" id="a2">
            <p><i class="fa-solid fa-clock"></i><p class="pen">Pending</p></p>
            <p id="pending">0</p>
        </div>

        <div class="active1" id="a3">
            <p><i class="fa-solid fa-square-check"></i><p>Completed</p></p>
            <p id="completed">0</p>
        </div>
    </div>

</div>
</div>
</div>

</body>
</html>
